# CodeRabbit reviews PRs into the default branch on its own. auth-workos collects
# the Backend Architecture Redesign until each milestone goes to development, so
# PRs into it are reviewed too. Settings not named here keep their defaults.
reviews:
  auto_review:
    base_branches:
      - auth-workos
  # A review covers at most 100 files on this repository's plan, counted after
  # these filters. They leave out files a reviewer gains nothing from: the OpenAPI
  # snapshot, which the openapi job checks against the code, and the generated
  # endpoint tables under docs/specs. scripts/milestone-budget.py reads this list.
  path_filters:
    - "!docs/openapi.json"
    - "!docs/specs/*.csv"
