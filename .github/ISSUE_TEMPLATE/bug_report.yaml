name: Bug Report
description: Report a bug or issue with the project
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please provide a detailed description of the bug.
      placeholder: Describe the bug here.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Please provide the steps to reproduce the bug.
      placeholder: Describe the steps to reproduce the bug here.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Please describe what you expected to happen.
      placeholder: Describe the expected behavior here.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Please describe what actually happened.
      placeholder: Describe the actual behavior here.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Select your operating system/platform.
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true