name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please provide a detailed description of the feature.
      placeholder: Describe the feature here.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Please describe the motivation behind this feature.
      placeholder: Describe the motivation here.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Please describe any alternatives you've considered.
      placeholder: Describe the alternatives here.
    validations:
      required: false