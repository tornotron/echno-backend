name: Deploy to Kubernetes

# Continuous deployment to the Kubernetes flavors, which run Argo CD (GitOps).
# This builds the image, pushes it to GHCR under an immutable per-commit tag,
# then writes that tag into tornotron/echno-deployment; the Argo CD running in
# the target cluster reconciles the change and rolls the new image out. GitHub
# never needs to reach the cluster, so the in-cluster (IITM) flavor works the
# same as DOKS.
#
# Two selectable flavors via the dispatch input:
#   self-managed -> k3s at IITM / on-prem  (values-iitm.yaml)
#   doks         -> DigitalOcean Kubernetes (values-doks.yaml)
#
# Dispatch-only, so it never collides with the compose merge-to-staging deploy.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Kubernetes flavor to deploy
        type: choice
        options: [self-managed, doks]
        default: self-managed

concurrency:
  group: deploy-k8s-${{ github.event.inputs.flavor }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/echno-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The dispatch input is read through the environment (never interpolated
      # into the shell source) and validated before anything downstream uses it.
      - name: Resolve flavor, values file and image tag
        id: f
        env:
          FLAVOR: ${{ github.event.inputs.flavor }}
        run: |
          case "$FLAVOR" in
            self-managed) values=values-iitm.yaml ;;
            doks)         values=values-doks.yaml ;;
            *) echo "unknown flavor: $FLAVOR" >&2; exit 1 ;;
          esac
          {
            echo "values=$values"
            echo "tag=staging-${FLAVOR}-${GITHUB_SHA}"
            echo "flavor=$FLAVOR"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # This job builds `context: .`, so keep the workflow token out of the
          # checked-out git config and away from the build context.
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Authenticate to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (immutable per-commit tag)
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.f.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fine-grained PAT with contents:write on echno-deployment. persist-credentials
      # is off so the cross-repo write token is not left in the checkout's git config
      # while the pinned yq binary runs; the token is handed only to the final push.
      - name: Check out the deployment repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tornotron/echno-deployment
          ref: main
          token: ${{ secrets.ECHNO_DEPLOYMENT_TOKEN }}
          persist-credentials: false
          path: deployment

      - name: Pin the new backend image digest for Argo CD
        working-directory: deployment
        env:
          FLAVOR: ${{ steps.f.outputs.flavor }}
          TAG: ${{ steps.f.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VALUES: ${{ steps.f.outputs.values }}
          DEPLOY_TOKEN: ${{ secrets.ECHNO_DEPLOYMENT_TOKEN }}
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          # The digest is what Argo CD deploys (immutable); the tag rides along for
          # human traceability. build-push-action emits the manifest digest as sha256:...
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "build did not produce a sha256 digest: '$DIGEST'" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          chmod +x /tmp/yq
          /tmp/yq -i ".backend.tag = strenv(TAG)" "k8s/helm/echno/${VALUES}"
          /tmp/yq -i ".backend.digest = strenv(DIGEST)" "k8s/helm/echno/${VALUES}"
          git config user.name "echno-ci"
          git config user.email "ci@echno.xyz"
          git add "k8s/helm/echno/${VALUES}"
          if git diff --cached --quiet; then
            echo "image digest unchanged; nothing to deploy"
            exit 0
          fi
          git commit -m "ci(echno-backend): ${FLAVOR} -> ${DIGEST}"
          git push "https://x-access-token:${DEPLOY_TOKEN}@github.com/tornotron/echno-deployment.git" HEAD:main
