name: Build, Push, and Deploy to Staging IIT Server

on:
  push:
    branches:
      - staging-iit

# Don't let two deploys run over the tunnel at the same time.
concurrency:
  group: deploy-staging-iit
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: echno-backend
  SERVICE_NAME: app

jobs:
  build_and_push:
    name: Build App and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build with Gradle (skip tests)
        run: ./gradlew build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-,suffix=,format=short
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/staging-iit' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging IIT Server
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      # The VPS has no public IP. This action installs cloudflared, presents the
      # Cloudflare Access service token, and SSHes through the tunnel. It does NOT
      # touch the cloudflared service on the server, so the session survives the
      # container restart.
      - name: Deploy over Cloudflare Tunnel
        uses: and-fm/cloudflared-ssh-action@v3
        with:
          host: ${{ secrets.SSH_HOST_IIT }}
          username: ${{ secrets.SSH_USERNAME_IIT }}
          private_key_filename: id_ed25519
          private_key_value: ${{ secrets.SSH_PRIVATE_KEY_IIT }}
          service_token_id: ${{ secrets.CF_ACCESS_CLIENT_ID_IIT }}
          service_token_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET_IIT }}
          commands: |
            set -euo pipefail
            cd /opt/echno
            echo "Pulling new image for ${{ env.SERVICE_NAME }}..."
            docker compose pull ${{ env.SERVICE_NAME }}
            echo "Recreating ${{ env.SERVICE_NAME }} (no dependency restarts)..."
            docker compose up -d --no-deps --force-recreate ${{ env.SERVICE_NAME }}
            echo "Pruning dangling images..."
            docker image prune -f
            echo "Deploy finished. Current state:"
            docker compose ps
