name: Staging (IITM)

# Deploy the backend to the IIT Madras staging node on echno.in.
#
# Same model as the DigitalOcean Staging workflow: build an image, push it to
# GHCR by digest, then run the Ansible playbook from tornotron/echno-deployment
# from an ephemeral tailnet runner. Three things differ, all forced by the lab
# node being a LAN machine rather than a tailnet device:
#
#   * the runner accepts the subnet route (--accept-routes) to reach a host that
#     is not itself on the tailnet;
#   * it addresses the node by its LAN IP from the inventory, so there is no
#     host-resolution step;
#   * it authenticates to the fereydon account with a key and a become password
#     rather than as deploy over Tailscale SSH.
#
# workflow_dispatch, not merge-triggered: while the DO box still exists a merge
# to staging deploys there. Switch the trigger to pull_request closed on staging
# once DO staging is retired and this is the only staging.

on:
  workflow_dispatch:

concurrency:
  group: staging-iitm-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/echno-backend

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Authenticate to the registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=staging-iitm-
            type=raw,value=staging-iitm-latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Authenticate to the registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployment repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tornotron/echno-deployment
          ssh-key: ${{ secrets.ECHNO_DEPLOYMENT_SSH_KEY }}
          path: deployment

      # The lab node is not a tailnet device: it sits on 10.24.6.0/24 behind the
      # hp-z / OptiPlex subnet routers. The runner joins as tag:cloud-staging,
      # which the ACL grants the lab route.
      - name: Join the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cloud-staging

      # The action's own `tailscale up` already sets --accept-routes, so passing
      # it again through args fails ("flag provided multiple times"). Enable the
      # subnet route in a separate step instead, so the runner can reach the node.
      - name: Accept the lab subnet route
        run: sudo tailscale set --accept-routes=true

      - name: Install Ansible
        run: python3 -m pip install --quiet ansible-core docker

      - name: Install collections
        working-directory: deployment/ansible
        run: ansible-galaxy collection install -r requirements.yml -p collections

      - name: Deploy
        working-directory: deployment/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass
          install -d -m 700 ~/.ssh
          printf '%s' "${{ secrets.LAB_NODE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # The fereydon sudo password comes from the vault (ansible.cfg reads
          # .vault_pass), so no separate become secret is needed here.
          ansible-playbook -i inventory/staging-iitm.yml playbooks/deploy-apps.yml \
            -e "echno_backend_image_digest=${{ needs.build.outputs.digest }}" \
            -e "vault_ghcr_pull_token=${{ secrets.GITHUB_TOKEN }}"

      - name: Clean up
        if: always()
        working-directory: deployment/ansible
        run: rm -f .vault_pass ~/.ssh/id_ed25519
