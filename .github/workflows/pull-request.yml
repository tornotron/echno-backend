name: Pull request

# Gate for changes entering `development`. Tests belong here rather than in the
# image build: an artefact should be packaged once and verified before it is
# promoted, not re-verified every time it is packaged.

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A hard ceiling so a hung test can never burn a multi-hour runner again. The
    # suite completes in a few minutes; anything approaching this is a hang to fix.
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile
        run: ./gradlew --no-daemon bootJar -x test

      # Run the full test suite and enforce the JaCoCo line-coverage floor
      # (jacocoLineFloor in build.gradle) so a merge cannot regress coverage.
      - name: Test
        run: ./gradlew --no-daemon test jacocoTestCoverageVerification

      # The committed OpenAPI document (docs/openapi.json) is the contract clients
      # read; echno-core checks the field names it sends against it. This regenerates
      # the document from this branch's code and fails if the committed copy has
      # drifted, so the file cannot quietly stop describing the backend. Its own
      # step, and its own forked JVM, because it boots a web context that does not
      # belong in the main suite's 1 GB heap. See OpenApiSnapshotTest.
      - name: OpenAPI document up to date
        run: ./gradlew --no-daemon openApiSnapshot

      # Uploaded on failure so a drift can be diffed without rerunning anything.
      - name: Upload the served OpenAPI document
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-served
          path: build/openapi.json
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action requires a paid licence for organisations.
      # The scanner itself is MIT, so it is invoked directly.
      #
      # Only the commits this pull request adds are scanned. Gating on full
      # history would fail permanently on pre-existing matches that are example
      # data, and a check that is always red gets ignored.
      - name: Scan for committed secrets
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
