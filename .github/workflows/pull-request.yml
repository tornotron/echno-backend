name: Pull request

# Gate for changes entering `development`. Tests belong here rather than in the
# image build: an artefact should be packaged once and verified before it is
# promoted, not re-verified every time it is packaged.

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile
        run: ./gradlew --no-daemon bootJar -x test

      # There is currently one test, a context-load check. This job exists so
      # that adding real tests immediately gates merges, rather than requiring
      # a pipeline change first.
      - name: Test
        run: ./gradlew --no-daemon test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
