name: Build, Push, and Deploy to Staging

on:
  push:
    branches:
      - staging

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: echno-backend
  SERVICE_NAME: app

jobs:
  # ------------ Job 1: Build and Push Docker Image ------------
  build_and_push:
    name: Build App and Push Docker Image
    runs-on: ubuntu-latest # Correct for GitHub runner environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Latest version, good

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21" # Correct if your project uses Java 21
          distribution: "temurin" # Good choice
          cache: "gradle" # Correct for a Gradle project

      - name: Build with Gradle
        run: ./gradlew build -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-,suffix=,format=short
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/staging' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------ Job 2: Deploy to Server ------------
  deploy:
    name: Deploy to Staging Server
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/echno-backend

            source .env

            docker compose stop ${{ env.SERVICE_NAME }}

            docker compose pull ${{ env.SERVICE_NAME }}

            docker compose up --force-recreate ${{ env.SERVICE_NAME }} -d
