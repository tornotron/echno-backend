# Local development dependencies for the backend: the four services the
# application needs. The database and cache run the same versions the IIT Madras
# staging runs (echno-deployment, ansible/roles/infra/defaults/main.yml); the object
# store is a MinIO build that can still be pulled (see the minio service), and the
# token issuer is a local stand-in for the real auth provider. Nothing here is a
# deployment: the credentials are fixed dev-only literals, every port binds on
# 127.0.0.1, and the compose file is excluded from the image by .dockerignore.
#
#   ./gradlew devUp      # compose up -d, --wait on the services, wait on the init jobs
#   ./gradlew bootRun --args='--spring.profiles.active=local'
#   ./gradlew devLogs    # follow the service logs
#   ./gradlew devDown    # stop and delete the volumes
#
# The ports are offset from the defaults (27257, 8180, 9100/9101, 6380) so this
# stack can share a host with a compose staging that holds the standard ones.
# Override any of them with the ECHNO_DEV_*_PORT variables and update
# application-local.yml to match. The project name keeps container and volume
# names under echno-dev-*, apart from any other echno-* stack on the same host.
name: echno-dev

services:
  cockroachdb:
    image: cockroachdb/cockroach:v26.2.4
    command: ["start-single-node", "--insecure", "--store=/cockroach/cockroach-data"]
    ports:
      - "127.0.0.1:${ECHNO_DEV_COCKROACH_PORT:-27257}:26257"
      - "127.0.0.1:${ECHNO_DEV_COCKROACH_UI_PORT:-28080}:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Creates the application database once the node answers. Liquibase owns the
  # schema from there; the backend runs the changelog on first start.
  cockroachdb-init:
    image: cockroachdb/cockroach:v26.2.4
    depends_on:
      cockroachdb:
        condition: service_healthy
    entrypoint: ["cockroach", "sql", "--insecure", "--host=cockroachdb:26257", "-e", "CREATE DATABASE IF NOT EXISTS echno"]
    restart: "no"

  # A stand-in OpenID Connect provider, so local development needs no account with the real
  # one. It signs tokens with a key it publishes at /echno/jwks, which is all the backend needs
  # to accept them: authorization comes from the application database, not from the token.
  #
  # Two ways to get a token. Interactive login (the authorize endpoint shows a form taking any
  # subject) serves a frontend doing the authorization-code flow. For a script or a curl,
  # the client-credentials grant mints a token whose subject is the client_id you send:
  #
  #   curl -s localhost:8180/echno/token -d grant_type=client_credentials \
  #        -d client_id=local-dev -d client_secret=unused
  #
  # Every token carries an email of <subject>@echno.local, which POST /auth/register reads.
  # The issuer is taken from the Host header, so always address it as localhost:8180 to
  # match echno.auth.jwt.issuers in application-local.yml.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.4
    environment:
      # $$ is compose's escape for a literal $; the server sees ${clientId}.
      JSON_CONFIG: >-
        {"interactiveLogin": true, "httpServer": "NettyWrapper",
         "tokenCallbacks": [{"issuerId": "echno", "tokenExpiry": 3600,
           "requestMappings": [{"requestParam": "client_id", "match": "*",
             "claims": {"sub": "$${clientId}", "aud": ["echno-backend"],
                        "email": "$${clientId}@echno.local", "name": "$${clientId}"}}]}]}
    ports:
      - "127.0.0.1:${ECHNO_DEV_OIDC_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/isalive"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # MinIO no longer serves its images anonymously: quay.io/minio and docker.io/minio both
  # answer 401. The Bitnami legacy build is still public and frozen at this tag. Its entrypoint
  # starts the server itself (API on 9000, console on 9001) as uid 1001, so the volume sits on
  # the image's own data directory, which that user owns.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: echno-dev
      MINIO_ROOT_PASSWORD: echno-dev-secret   # dev-only
    ports:
      - "127.0.0.1:${ECHNO_DEV_MINIO_PORT:-9100}:9000"
      - "127.0.0.1:${ECHNO_DEV_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # The buckets the application expects: the attachment bucket
  # (digital-ocean.bucket-name) and the consented dataset export bucket
  # (echno.dataset-export.bucket). The attachment bucket is readable anonymously
  # so the cdn-endpoint URLs the API hands out resolve in a browser, as they do
  # against Spaces.
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_CONFIG_DIR: /tmp/.mc   # the image runs as uid 1001 with no writable home
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 echno-dev echno-dev-secret &&
        mc mb --ignore-existing local/echno-dev local/echno-datasets &&
        mc anonymous set download local/echno-dev
    restart: "no"

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${ECHNO_DEV_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cockroach-data:
  minio-data:
