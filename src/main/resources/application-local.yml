# Local development profile. Every value points at the services docker-compose.dev.yml
# starts, on the offset localhost ports that file publishes. Activate it with
#   ./gradlew bootRun --args='--spring.profiles.active=local'
# Nothing here is a real credential: the literals are the dev-only ones the compose
# file carries, and they exist on no deployed instance.

spring:
  datasource:
    url: jdbc:postgresql://localhost:27257/echno?sslmode=disable
    username: root
    password: ""
  data:
    redis:
      host: localhost
      port: 6380
  liquibase:
    contexts: v4

API:
  VERSION: v1

digital-ocean:
  uri: http://localhost:9100
  presign-endpoint: http://localhost:9100
  path-style-access: true
  access-key-id: echno-dev
  secret-access-key: echno-dev-secret
  bucket-name: echno-dev
  cdn-endpoint: http://localhost:9100/echno-dev

# 32 hex characters; a dev-only key for the column encryption.
encryption:
  secret-key: 0123456789abcdef0123456789abcdef

echno:
  cache:
    provider: redis
  entitlement:
    mode: advisory
  # The mock issuer in docker-compose.dev.yml. Fetch a token with
  #   curl -s localhost:8180/echno/token -d grant_type=client_credentials -d client_id=local-dev -d client_secret=x
  # and the dev fixture below has already given that subject an organization to work in. Any other
  # client_id is a fresh account: POST /api/v1/auth/register first, then create or join one.
  auth:
    jwt:
      jwk-set-uri: ${WORKOS_CLIENT_ID}
      issuers: ""
      audiences: ""
    platform-admin-subjects: ""
  cors:
    allowed-origins: http://localhost:3000
  dev-fixture:
    enabled: false
    subject: local-dev
    name: Local Developer
    email: local-dev@echno.local

springdoc:
  swagger-ui:
    public-access: true

logging:
  file:
    name: logs/echno-backend-local.log
