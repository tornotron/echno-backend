management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  prometheus:
    metrics:
      export:
        enabled: true
spring:
  jackson:
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false
  application:
    name: echno_backend
  datasource:
    url: jdbc:postgresql://localhost:5432/echno_database
    username: root
    password: password
  jpa:
    database: postgresql
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8080
  forward-headers-strategy: native
logging:
  file:
    name: /var/log/echno_backend.log
  level:
    org:
      springframework: warn
    root: info
    web: debug
    com: debug
    com.echno: debug
    com.echno.backend: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
  config: classpath:logback-spring.xml


