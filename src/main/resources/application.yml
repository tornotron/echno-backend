jwt:
  auth:
    converter:
      resource-id: ${KEYCLOAK_BACKEND_CLIENT}
      principle-attribute: preferred_username

digital-ocean:
  uri: ${DIGITAL_OCEAN_SPACES_URI}
  presign-endpoint: ${OBJECT_STORE_PUBLIC_ENDPOINT:${DIGITAL_OCEAN_SPACES_URI}}
  path-style-access: ${DIGITAL_OCEAN_SPACES_PATH_STYLE:true}
  access-key-id: ${DIGITAL_OCEAN_SPACES_KEY_ID}
  secret-access-key: ${DIGITAL_OCEAN_SPACES_KEY_SECRET}
  bucket-name: ${DIGITAL_OCEAN_SPACES_BUCKET_NAME}
  cdn-endpoint: ${DIGITAL_OCEAN_SPACES_CDN_ENDPOINT}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY}

management:
  endpoint:
    prometheus:
      access: unrestricted
    health:
      # /actuator is permitAll (kubelet probes and the compose healthcheck reach it
      # without a credential), so whatever this value is, it is served to whoever can
      # reach the port. "always" would put every component's detail there: database
      # url, disk paths, broker addresses. "when_authorized" keeps the aggregate
      # status the probes need and withholds the breakdown from an anonymous caller.
      # Both deployed environments already set this to when_authorized by env var; the
      # shipped default now matches, so a developer run and any future deployment
      # shape inherit it too.
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
  endpoints:
    web:
      exposure:
        include: prometheus,health,info

  metrics:
    enabled:
      spring.batch: false
  prometheus:
    metrics:
      export:
        enabled: true

API:
  VERSION: ${BACKEND_API_VERSION}


# OpenAI-compatible chat-completions endpoint, used to generate compliance inspections when a
# project is approved. base-url points at any OpenAI-compatible service (DigitalOcean Gradient
# serverless inference by default; override for OpenAI or a self-hosted gateway). api-key is a
# secret injected at deploy time; when it is empty (or enabled=false) the compliance AI no-ops
# and the application runs normally without a key.
compliance:
  ai:
    base-url: ${COMPLIANCE_AI_BASE_URL:https://inference.do-ai.run/v1}
    api-key: ${COMPLIANCE_AI_API_KEY:}
    model: ${COMPLIANCE_AI_MODEL:llama3.3-70b-instruct}
    max-tokens: 4096
    temperature: 0.2
    enabled: ${COMPLIANCE_AI_ENABLED:true}
    # Candidate rules per model call, and how many of those calls may overlap.
    # Measured against the configured endpoint: the answer costs about 57 completion
    # tokens per rule, so one call for 72 rules exhausts max-tokens (a 72-rule run came
    # back cut off at exactly 4096), and wall clock runs about 1.7 s per rule. Ten rules
    # is therefore ~600 tokens and ~20 s, well inside both limits. Four in flight because
    # the endpoint served four simultaneous calls in the time it served one; set it to 1
    # for an endpoint that rate-limits per key. batch-size 0 disables batching.
    batch-size: ${COMPLIANCE_AI_BATCH_SIZE:10}
    batch-concurrency: ${COMPLIANCE_AI_BATCH_CONCURRENCY:4}
    # Optional forward proxy for egress (unset = direct, the DO production behaviour).
    # Set both when the backend has no direct internet, e.g. the IITM lab host proxy.
    proxy-host: ${COMPLIANCE_AI_PROXY_HOST:}
    proxy-port: ${COMPLIANCE_AI_PROXY_PORT:3128}
    # HTTP timeouts for the inference call. read-timeout-seconds is sized against
    # batch-size, not the catalogue: at ~1.7 s per rule a ten-rule batch takes ~20 s, a
    # third of the 60 s budget. Raise batch-size and this has to move with it (twenty
    # rules is ~34 s, past thirty a batch no longer fits). A slower endpoint or a loaded
    # forward proxy moves the same line without the batch size changing.
    connect-timeout-seconds: ${COMPLIANCE_AI_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${COMPLIANCE_AI_READ_TIMEOUT_SECONDS:60}
  # The generation queue. Every replica polls and claims with a conditional update, so
  # there is no leader. enabled: false still accepts jobs but runs none, which is what a
  # replica that should serve requests and do no background work wants.
  job:
    enabled: ${COMPLIANCE_JOB_ENABLED:true}
    poll-interval-millis: 2000
    max-in-flight: ${COMPLIANCE_JOB_MAX_IN_FLIGHT:2}
    lease-duration: 5m
    max-attempts: 3
  # The catch-up sweep for projects approved before the rules that apply to them existed.
  # OFF by default and deliberately so: the mechanism is settled, the policy is not. Which
  # catalogue changes should count as worth re-assessing for, how often a pass should run,
  # and whether a tenant may decline it are product decisions, and all three are config.
  # Turning it on spends inference for every project it finds stale. It paces itself through
  # the queue above, so max-projects-per-run bounds the spend while job.max-in-flight bounds
  # how many runs ever hit the endpoint at once.
  sweep:
    enabled: ${COMPLIANCE_SWEEP_ENABLED:false}
    cron: ${COMPLIANCE_SWEEP_CRON:0 0 2 * * *}
    zone: ${COMPLIANCE_SWEEP_ZONE:UTC}
    scan-limit: ${COMPLIANCE_SWEEP_SCAN_LIMIT:500}
    max-projects-per-run: ${COMPLIANCE_SWEEP_MAX_PROJECTS_PER_RUN:25}


# Chart-of-accounts auto numbering. level-steps is the gap between sibling codes
# at each depth (0 = roots); root-blocks is the first code per account type.
finance:
  account-numbering:
    level-steps: [1000, 100, 10, 1]
    root-blocks:
      ASSET: 1000
      LIABILITY: 2000
      EQUITY: 3000
      INCOME: 4000
      EXPENSE: 5000
  invoice:
    ar-account-code: "1200"   # Accounts Receivable (postable leaf)
    gst-output-code: "2210"   # GST Output Payable (postable leaf)
  construction:
    ap-account-code: "2100"        # Accounts Payable (postable leaf)
    gst-input-code: "1410"         # GST Input Credit (postable leaf)
    default-expense-code: "5100"   # Cost of Materials and Purchases (postable leaf)
    default-revenue-code: "4100"   # Construction Revenue (postable leaf)


keycloak-initializer:
  initialize-on-startup: true
  master-realm: ${KEYCLOAK_INITIALIZER_MASTER_REALM}
  application-realm: ${KEYCLOAK_INITIALIZER_APPLICATION_REALM}
  client-id: ${KEYCLOAK_INITIALIZER_CLIENT_ID}
  username: ${KEYCLOAK_INITIALIZER_USERNAME}
  password: ${KEYCLOAK_INITIALIZER_PASSWORD}
  url: ${KEYCLOAK_INITIALIZER_URL}


bucket4j:
  enabled: false
  filters:
    - cache-name: rate-limit-buckets
      url: ^/api/.*
      http-status-code: TOO_MANY_REQUESTS
      http-response-body: "{ \"error\": \"Rate limit exceeded. Try again later.\" }"
      http-response-headers:
        X-Rate-Limit-Remaining: "#{getAvailableTokens()}"
      rate-limits:
        - cache-key: "getRemoteAddr()"
          bandwidths:
            - capacity: 20
              time: 1
              unit: minutes
              refill-speed: interval


keycloak:
  issuer-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI}
  frontend:
    client-id: ${KEYCLOAK_FRONTEND_CLIENT}
    redirect-uri: ${KEYCLOAK_FRONTEND_REDIRECT_URI}
    web-origin: ${KEYCLOAK_FRONTEND_WEB_ORIGIN},${KEYCLOAK_FRONTEND_WEB_ORIGIN_LOCALHOST:}
  client-id: ${KEYCLOAK_BACKEND_CLIENT}
  redirect-uri: ${KEYCLOAK_BACKEND_REDIRECT_URI},${KEYCLOAK_BACKEND_REDIRECT_URI_APIDOG}
  web-origin: ${KEYCLOAK_BACKEND_WEB_ORIGIN}
  secret: ${KEYCLOAK_BACKEND_SECRET}
  # Whether the realm's self-service registration page is enabled. Reconciled onto the realm on
  # every deploy. Default false keeps dedicated/per-client instances closed (an admin creates the
  # org); the public shared instance sets KEYCLOAK_REGISTRATION_ALLOWED=true so a signed-up user
  # can create their own org.
  registration-allowed: ${KEYCLOAK_REGISTRATION_ALLOWED:false}
  # Local-development convenience fixture (issue #451): the public 'echno-web-local' client (localhost
  # redirect), the 'echno-local-dev' login, and the development organization that login is an employee
  # of, reconciled into the realm so they survive a realm rebuild. Default false keeps them OUT of
  # every real instance (a localhost redirect must never exist in a production realm); a staging deploy
  # sets KEYCLOAK_DEV_CLIENT_ENABLED=true to enable them.
  dev-client-enabled: ${KEYCLOAK_DEV_CLIENT_ENABLED:false}
  dev-user:
    # Password for the dev account when the dev client is enabled. Public dev credential only, never a
    # real one; override per environment via KEYCLOAK_DEV_USER_PASSWORD.
    password: ${KEYCLOAK_DEV_USER_PASSWORD:echno-dev}
  # Realm-scoped initializer client (H-3). Steady-state startup reconcile authenticates as this
  # confidential service account (realm-admin on the application realm only) instead of the master
  # credential. The master credential (keycloak-initializer.*) is now used only to bootstrap a fresh
  # or not-yet-migrated environment: create the realm and provision this client + its secret.
  initializer:
    service-client-id: ${KEYCLOAK_INITIALIZER_SERVICE_CLIENT_ID:echno-initializer}
    service-client-secret: ${KEYCLOAK_INITIALIZER_CLIENT_SECRET:}
  admin:
    userName: ${KEYCLOAK_BACKEND_ADMIN_USERNAME}
    email: ${KEYCLOAK_BACKEND_ADMIN_EMAIL}
    password: ${KEYCLOAK_BACKEND_ADMIN_PASSWORD}
    firstName: ${KEYCLOAK_BACKEND_ADMIN_FIRST_NAME}
    lastName: ${KEYCLOAK_BACKEND_ADMIN_LAST_NAME}
  service:
    userName: ${KEYCLOAK_BACKEND_SERVICE_USERNAME}
    email: ${KEYCLOAK_BACKEND_SERVICE_EMAIL}
    password: ${KEYCLOAK_BACKEND_SERVICE_PASSWORD}
    firstName: ${KEYCLOAK_BACKEND_SERVICE_FIRST_NAME}
    lastName: ${KEYCLOAK_BACKEND_SERVICE_LAST_NAME}
  config:
    output-path: src/main/resources/config


echno:
  cache:
    # Single switch for cross-replica shared state. Default 'caffeine' keeps every cache and the
    # Bucket4j rate limiter in-process (the single-replica compose staging behaviour: no Redis is
    # contacted and no Redis bean is created). Set to 'redis' on multi-replica deployments to back
    # the Spring cache abstraction and the rate limiter with the shared Redis configured under
    # spring.data.redis below, so limits and cached values are shared across pods.
    provider: ${ECHNO_CACHE_PROVIDER:caffeine}
  security:
    jwt:
      # Reject any access token whose audience does not include the backend client
      # (the RPT is minted for exactly this client, so legitimate tokens always match).
      require-audience: ${ECHNO_JWT_REQUIRE_AUDIENCE:true}
      # Comma-separated list of issuers the token's `iss` claim must match. Empty
      # disables the check. Keycloak stamps the realm's canonical (frontend) issuer,
      # which can differ from the internal URL the backend dials, so list every URL
      # the same realm may present.
      accepted-issuers: ${ECHNO_JWT_ACCEPTED_ISSUERS:}
  document-number:
    # Site transfer, purchase order, indent and GRN numbers carry the year they were issued in,
    # and the counter behind them resets with it. The year is read in this zone rather than the
    # container's, so a document raised at eight in the morning in Kerala is not stamped with
    # the previous year because the server happens to run on UTC.
    zone: ${ECHNO_DOCUMENT_NUMBER_ZONE:Asia/Kolkata}
  multitenancy:
    # What happens when work reaches tenant-scoped data with no tenant scope declared at all:
    # no organization id, no @BypassTenantFilter, no @WithoutTenant. ALLOW proceeds silently,
    # which is the pre-#507 behaviour and is kept only as the incident escape hatch. WARN
    # proceeds but counts the event under echno.multitenancy.unscoped and logs the call site
    # (rate limited per call site, see warn-interval-seconds). DENY refuses the work.
    #
    # The two boundaries differ because they are not equally precise. The load boundary fires
    # when a tenant-scoped entity is actually read, which is the leak itself, so it denies. The
    # transaction boundary fires on every @Transactional method in the package tree, including
    # the many that touch no tenant-scoped entity at all (users, organizations, plans,
    # subscriptions), so it observes rather than refuses until that list has been worked
    # through on a real deployment.
    load-boundary: ${ECHNO_TENANT_LOAD_BOUNDARY:DENY}
    transaction-boundary: ${ECHNO_TENANT_TRANSACTION_BOUNDARY:WARN}
    # How long to suppress repeat warnings for the same call site. An unscoped read inside a
    # loop would otherwise produce one line per row and bury what it is reporting. The metric
    # is never suppressed, so the count stays true whatever this is set to. Zero logs every one.
    warn-interval-seconds: ${ECHNO_TENANT_WARN_INTERVAL_SECONDS:60}
  transaction:
    retry:
      # CockroachDB runs SERIALIZABLE and aborts one side of a read-write conflict with
      # SQLSTATE 40001, expecting the client to run the transaction again. TransactionRetryTemplate
      # does that for the units of work that opt in. Attempts include the first try; the wait
      # between attempts doubles from the initial value and is fully jittered up to the cap, so
      # two transactions that abort against each other do not wake up together and collide again.
      # Both backoff values are clamped to 0..2000 ms at startup, since they land on a request
      # thread; an override outside that range is logged and replaced with the nearest bound.
      max-attempts: ${ECHNO_TXN_RETRY_MAX_ATTEMPTS:4}
      initial-backoff-millis: ${ECHNO_TXN_RETRY_INITIAL_BACKOFF_MS:25}
      max-backoff-millis: ${ECHNO_TXN_RETRY_MAX_BACKOFF_MS:250}


spring:
  # Connection for the optional Redis cache/rate-limit backing. Only read when
  # echno.cache.provider=redis; on the default caffeine profile nothing consumes these and no
  # connection is opened. Host/port follow the Spring Boot standard env vars.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # We use Redis only to back the Spring cache, never Spring Data Redis
      # repositories. Leaving repositories on makes RedisRepositoriesAutoConfiguration
      # activate as soon as a RedisConnectionFactory exists (i.e. when the provider is
      # redis) and register a redisReferenceResolver that needs the redisTemplate bean,
      # which is absent because RedisAutoConfiguration is excluded. Disabling them keeps
      # the redis provider booting cleanly with no repository infrastructure.
      repositories:
        enabled: false
    # The newer endpoints take a Spring Data Pageable rather than the pageNo/pageSize pair,
    # so their page size is bounded by the resolver rather than by PageQuery. Spring's own
    # default ceiling is 2000, which is four times the row cap the rest of the API applies;
    # bringing it down to UnpagedResultCap.MAX_ROWS makes one ceiling hold whichever way an
    # endpoint declares its paging. The resolver clamps rather than refusing, which is its
    # behaviour and not ours to change.
    web:
      pageable:
        max-page-size: 500
  cache:
    cache-names:
      - rate-limit-buckets
    caffeine:
      spec: maximumSize=100000,expireAfterAccess=3600s,recordStats
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout:
        30000
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  thymeleaf:
    cache: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI}

  jackson:
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false
  application:
    name: echno_backend
  jpa:
    open-in-view: false
    database: postgresql
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Batch-load lazy associations and collections in IN-clause groups instead of
        # one query per parent row. Turns the N+1 on list endpoints (each row pulling
        # its own to-one/to-many) into a handful of batched queries. No effect on the
        # response shape, and unlike a collection JOIN FETCH it composes with pagination.
        default_batch_fetch_size: 100
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: v4

springdoc:
  swagger-ui:
    # Whether /swagger-ui/**, /swagger-ui.html and /v3/api-docs/** are served to an
    # unauthenticated caller. Off by default: the OpenAPI document is the whole
    # endpoint surface, every path, parameter and DTO schema in one download, which is
    # the reconnaissance step for finding the endpoint whose authorization is weakest.
    #
    # This used to ship as true, and what kept it private was a rule on the compose
    # edge vhost that 404s the docs paths. That rule is still there and still right,
    # but it only ever covered one ingress: the k8s ingress carries no equivalent, so
    # for as long as it has existed the document has been a public download on
    # backend-k8s.echno.in. The default belongs here, where every ingress inherits it,
    # rather than in a rule each new front door has to remember. See issue #569.
    #
    # Turn it on where the docs are wanted (a developer's own run, or a staging the
    # team reads them on) by setting SWAGGER_PUBLIC_ACCESS=true for that environment.
    # With it off, the paths answer 401 rather than 404: springdoc still builds the
    # document, Spring Security just refuses to hand it to an anonymous caller.
    public-access: ${SWAGGER_PUBLIC_ACCESS:false}

server:
  tomcat:
    threads:
      max: 150
    accept-count: 100
    connection-timeout: 20000
  port: 8080
  forward-headers-strategy: FRAMEWORK
  servlet:
    context-path: /

logging:
  file:
    name: /var/log/echno_backend.log
  level:
    root: WARN
    org.springframework: WARN
    org.springframework.security: INFO
    org.hibernate: WARN
    org.tornotron: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n"
  config: classpath:logback-spring.xml

loki:
  url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}