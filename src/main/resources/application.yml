jwt:
  auth:
    converter:
      resource-id: echno-app
      principle-attribute: preferred_username

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  metrics:
    enabled:
        spring.batch: false
  prometheus:
    metrics:
      export:
        enabled: true



keycloak-initializer:
  initialize-on-startup: true
  master-realm: ${KEYCLOAK_INITIALIZER_MASTER_REALM}
  application-realm: ${KEYCLOAK_INITIALIZER_APPLICATION_REALM}
  client-id: ${KEYCLOAK_INITIALIZER_CLIENT_ID}
  username: ${KEYCLOAK_INITIALIZER_USERNAME}
  password: ${KEYCLOAK_INITIALIZER_PASSWORD}
  url: ${KEYCLOAK_INITIALIZER_URL}


bucket4j:
  enabled: true
  filters:
    - cache-name: rate-limit-buckets
      url: ^/api/.*
      http-status-code: TOO_MANY_REQUESTS
      http-response-body: "{ \"error\": \"Rate limit exceeded. Try again later.\" }"
      http-response-headers:
        X-Rate-Limit-Remaining: "#{getAvailableTokens()}"
      rate-limits:
        - cache-key: "getRemoteAddr()"
          bandwidths:
            - capacity: 20
              time: 1
              unit: minutes
              refill-speed: interval

spring:
  cache:
    cache-names:
      - rate-limit-buckets
    caffeine:
      spec: maximumSize=100000,expireAfterAccess=3600s
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  thymeleaf:
    cache: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: ${KEYCLOAK_REDIRECT_URI}
            scope: openid,profile,email
        provider:
            keycloak:
              issuer-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI}
              jwk-set-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI}
#      resourceserver:
#        jwt:
#          issuer-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI}
#          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI}

  jackson:
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false
  application:
    name: echno_backend
  jpa:
    open-in-view: false
    database: postgresql
    show-sql: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB


server:
  port: 8080
  forward-headers-strategy: FRAMEWORK
  servlet:
    context-path: /

logging:
  file:
    name: /var/log/echno_backend.log
  level:
    root: WARN
    org.springframework: WARN
    org.springframework.security: INFO
    org.hibernate: WARN
    org.tornotron: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n"
  config: classpath:logback-spring.xml