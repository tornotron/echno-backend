keycloak:
  client-id: echno-app
  client-secret: your-client-secret
  realm: echno-realm

jwt:
  auth:
    converter:
      resource-id: echno-app
      principle-attribute: preferred_username

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://echno.xyz/keycloak/realms/echno-realm
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: echno-app
            client-secret: your-client-secret
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: https://echno.xyz/keycloak/realms/echno-realm
            user-name-attribute: preferred_username

  jackson:
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false
  application:
    name: echno_backend
  datasource:
    url: jdbc:postgresql://postgres_db:5432/echno_database
    username: root
    password: password
  jpa:
    database: postgresql
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  forward-headers-strategy: FRAMEWORK
  servlet:
    context-path: /

logging:
  file:
    name: /var/log/echno_backend.log
  level:
    root: WARN
    org.springframework: WARN
    org.springframework.security: INFO
    org.hibernate: WARN
    org.tornotron: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n"
  config: classpath:logback-spring.xml