databaseChangeLog:
  # ==========================================
  # CHANGESET 1: Create Users Table
  # ==========================================
  - changeSet:
      id: 1-create-users-table
      author: system
      changes:
        - createTable:
            tableName: users_table
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: keycloak_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: VARCHAR(50)
              - column:
                  name: address
                  type: VARCHAR(500)
              - column:
                  name: blood_group
                  type: VARCHAR(10)
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    unique: true
              - column:
                  name: phone
                  type: VARCHAR(20)
                  constraints:
                    unique: true
              - column:
                  name: accept_terms
                  type: BOOLEAN
              - column:
                  name: date_of_birth
                  type: TIMESTAMP
              - column:
                  name: qualification
                  type: VARCHAR(255)
              - column:
                  name: skills
                  type: text[]
              - column:
                  name: experience
                  type: INT
              - column:
                  name: cv_url
                  type: VARCHAR(500)
              - column:
                  name: emergency_contact
                  type: VARCHAR(255)
              - column:
                  name: role
                  type: VARCHAR(50)
              - column:
                  name: profile_picture_url
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  # ==========================================
  # CHANGESET 2: Create Organization
  # ==========================================
  - changeSet:
      id: 2-create-organization
      author: system
      changes:
        - createTable:
            tableName: organization
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: organization_address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: organization_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: organization_phone
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: organization_website
                  type: VARCHAR(255)
              - column:
                  name: organization_logo
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: creator_id
                  type: INT
              - column:
                  name: is_active
                  type: BOOLEAN
        - createIndex:
            indexName: idx_organization_name
            tableName: organization
            columns:
              - column:
                  name: organization_name

  # ==========================================
  # CHANGESET 3: Create Category
  # ==========================================
  - changeSet:
      id: 3-create-category
      author: system
      changes:
        - createTable:
            tableName: category
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
