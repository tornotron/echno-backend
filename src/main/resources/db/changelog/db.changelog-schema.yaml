                  name: category_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: category_description
                  type: TEXT
              - column:
                  name: category_icon
                  type: VARCHAR(500)
              - column:
                  name: category_image
                  type: VARCHAR(500)

  # ==========================================
  # CHANGESET 4: Create Material
  # ==========================================
  - changeSet:
      id: 4-create-material
      author: system
      changes:
        - createTable:
            tableName: material
