              - column:
                  name: start_date
                  type: TIMESTAMP
              - column:
                  name: end_date
                  type: TIMESTAMP
              - column:
                  name: organization_id
                  type: BIGINT
        - createIndex:
            indexName: idx_project_name
            tableName: project
            columns:
              - column:
                  name: project_name
        - addForeignKeyConstraint:
            baseTableName: project
            baseColumnNames: organization_id
            constraintName: fk_project_organization
            referencedTableName: organization
            referencedColumnNames: id
            onDelete: CASCADE

