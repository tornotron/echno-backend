<div xmlns:th="http://www.thymeleaf.org" th:fragment="content">
    <p style="margin:0 0 16px;font-size:18px;font-weight:bold;" th:text="${organization} != null ? |Join ${organization} on ${product}| : |You are invited to ${product}|">Join on Echno</p>
    <p style="margin:0 0 16px;" th:if="${inviter} != null and ${organization} != null" th:text="|${inviter} has invited you to join ${organization} on ${product}.|">Invited.</p>
    <p style="margin:0 0 16px;" th:if="${inviter} == null and ${organization} != null" th:text="|You have been invited to join ${organization} on ${product}.|">Invited.</p>
    <p style="margin:0 0 16px;" th:if="${organization} == null" th:text="|You have been invited to ${product}.|">Invited.</p>
    <p style="margin:0 0 24px;">Accept the invitation to set up your account and sign in.</p>
    <p style="margin:0 0 24px;">
        <a th:href="${link}" href="#"
           style="display:inline-block;background:#0f3d5e;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-weight:bold;">Accept invitation</a>
    </p>
    <p style="margin:0 0 8px;font-size:13px;color:#6b7785;" th:if="${expires} != null" th:text="|The invitation expires on ${expires}.|">Expires.</p>
    <p style="margin:0;font-size:13px;color:#6b7785;">If the button does not work, copy this address into your browser:</p>
    <p style="margin:4px 0 0;font-size:13px;word-break:break-all;"><a th:href="${link}" th:text="${link}" href="#" style="color:#0f3d5e;">link</a></p>
</div>
