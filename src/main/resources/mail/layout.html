<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject}">Subject</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background:#0f3d5e;padding:20px 32px;color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:0.5px;"
                        th:text="${product}">Echno</td>
                </tr>
                <tr>
                    <td style="padding:32px;font-size:15px;line-height:1.6;" th:insert="~{${body} :: content}"></td>
                </tr>
                <tr>
                    <td style="padding:16px 32px 28px;font-size:12px;line-height:1.5;color:#6b7785;border-top:1px solid #e4e7eb;">
                        <span th:text="|This email was sent to ${email} by ${product}.|">This email was sent.</span>
                        <span th:text="${footer}">If you were not expecting it, you can ignore it.</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
