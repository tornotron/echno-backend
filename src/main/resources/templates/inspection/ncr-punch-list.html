<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Punch list</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 16mm 14mm 16mm 14mm;
        }

        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 9.5px;
            color: #1f2933;
            margin: 0;
        }

        .doc-header {
            border-bottom: 2px solid #c2410c;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .brand {
            color: #c2410c;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .doc-title {
            font-size: 13px;
            font-weight: bold;
            margin-top: 2px;
        }

        .doc-number {
            font-size: 11px;
            color: #52606d;
            margin-top: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .grid th, .grid td {
            border: 1px solid #d7d7d7;
            padding: 4px 5px;
            text-align: left;
            vertical-align: top;
        }

        .grid th {
            background: #f5f5f4;
            font-size: 8.5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #52606d;
        }

        .note {
            font-size: 8.5px;
            color: #8a6d3b;
            background: #fdf6e3;
            border: 1px solid #f0e0b0;
            padding: 5px 7px;
            margin: 6px 0;
        }

        .footer {
            margin-top: 16px;
            padding-top: 6px;
            border-top: 1px solid #dcdcdc;
            font-size: 8px;
            color: #767676;
        }
    </style>
</head>
<body>

<div class="doc-header">
    <div class="brand">Echno</div>
    <div class="doc-title">Punch List</div>
    <div class="doc-number">
        <span th:text="${typeLabel}">-</span> non-conformances still open &#183;
        <span th:text="${total}">0</span> outstanding
    </div>
</div>

<p class="note" th:if="${truncated}"
   th:text="|${total} non-conformances are outstanding. This list prints the most recent ${rowCap}.|"></p>

<table class="grid">
    <tr>
        <th>#</th>
        <th>Report</th>
        <th>Discipline</th>
        <th>Title</th>
        <th>Severity</th>
        <th>Status</th>
        <th>Site engineer</th>
        <th>Target</th>
        <th>Raised</th>
    </tr>
    <tr th:each="row : ${rows}">
        <td th:text="${row.index}">1</td>
        <td th:text="${row.ncrNumber}">-</td>
        <td th:text="${row.type}">-</td>
        <td th:text="${row.title}">-</td>
        <td th:text="${row.severity}">-</td>
        <td th:text="${row.status}">-</td>
        <td th:text="${row.siteEngineer}">-</td>
        <td th:text="${row.targetDate}">-</td>
        <td th:text="${row.raisedOn}">-</td>
    </tr>
    <tr th:if="${#lists.isEmpty(rows)}">
        <td colspan="9">Nothing is outstanding.</td>
    </tr>
</table>

<div class="footer">
    Generated by Echno on <span th:text="${generatedOn}">-</span>. This is a system-generated report.
</div>

</body>
</html>
