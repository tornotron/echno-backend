<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Site Progress Report</title>
    <link rel="stylesheet" type="text/css" href="../static/css/report.css" />
</head>
<body>
<div class="header">My Site Progress Report</div>


<div class="heading">Task Summary</div>
<!-- summary cards -->
<table class="cards-table">
    <tr>
        <td>
            <div class="card completed">
                <div class="title">COMPLETED</div>
                <div class="num" th:text="${counts['COMPLETED'] ?: 0}">0</div>
<!--                <div class="small">Delayed: <span th:text="${delayedCounts['COMPLETED'] ?: 0}">0</span></div>-->
            </div>
        </td>
        <td>
            <div class="card inprogress">
                <div class="title">IN PROGRESS</div>
                <div class="num" th:text="${counts['IN_PROGRESS'] ?: 0}">0</div>
<!--                <div class="small">Delayed: <span th:text="${delayedCounts['IN_PROGRESS'] ?: 0}">0</span></div>-->
            </div>
        </td>
        <td>
            <div class="card notstarted">
                <div class="title">NOT STARTED</div>
                <div class="num" th:text="${counts['NOT_STARTED'] ?: 0}">0</div>
<!--                <div class="small">Delayed: <span th:text="${delayedCounts['NOT_STARTED'] ?: 0}">0</span></div>-->
            </div>
        </td>
    </tr>
</table>

<!-- activity summary -->
<table class="activity-table">
    <tr>
        <td><div class="box">Task Updates<strong th:text="${taskTotal ?: 0}">0</strong></div></td>
        <td><div class="box">Issues Created<strong th:text="${issuesCount ?: 0}">0</strong></div></td>
        <td><div class="box">Attendance Logged<strong th:text="${attendanceCount ?: 0}">0</strong></div></td>
    </tr>
</table>

<!-- tasks -->
<p class="truncation-note" th:if="${truncated}"
   th:text="|Showing the first ${rowCap} tasks and indents. This tenant has ${taskTotal} tasks and ${indentTotal} indents in total.|"></p>
<div th:each="task : ${tasks}">
    <div class="task-block" th:classappend="${task.getProgress() == 100 ? 'completed' : (task.getProgress() > 0 ? 'inprogress' : 'notstarted')}">
        <div class="section-heading">
            Task Created: <span th:text="${dateConverter.convertDateToString(task.getUpdatedAt())}"></span>
            <span class="category-span">Category: <span th:text="${task.category?.name ?: '-'}"></span></span>
        </div>

        <table class="task-table">
            <tr>
                <td class="task-left">
                    <div class="task-name"><span th:text="${task.getId()}"></span>: <span th:text="${task.getTitle()}"></span></div>
<!--                    <div class="muted">Total Planned Quantity: <span th:text="${task.totalPlanned} + ' %'"></span></div>-->
<!--                    <div class="muted">Start: <span th:text="${task.getCreatedAt()}">DD/MM/YYYY</span> &#160; End: <span th:text="${task.endDate}">DD/MM/YYYY</span></div>-->
<!--                    <div class="muted">Latest Update By: <span th:text="${task.latestUpdateBy}"></span> on <span th:text="${task.latestUpdateDate}"></span></div>-->
<!--                    <div class="remark"><strong>Remark:</strong> <span th:text="${task.remarks}">&#45;&#45;</span></div>-->
                </td>
                <td class="task-right">
                    <div class="valbox">
                        <!--
                          The percentage is printed beside the caption rather than inside the bar.
                          Inside, a task at 0% drew its "0%" in a bar of zero width, so the label
                          spilled over the empty track and read as though it belonged to it. Widening
                          the bar to fit the label would have been worse: it would show a task that
                          has not started as though it had.
                        -->
                        <div class="label">Progress Till Date<span class="progress-value" th:text="${task.getProgress()} + '%'">0%</span></div>
                        <div class="progress-bar-container">
                            <div class="progress-bar" th:classappend="${task.getProgress() == 100 ? 'completed' : ''}" th:style="'width: ' + ${task.getProgress()} + '%;'"></div>
                        </div>
                    </div>
                    <!--                    <div class="valbox"><div class="label">Today's Update</div><div class="value" th:text="${task.progressPercent} + '%'">0%</div></div>-->
<!--                    <div class="valbox"><div class="label">Quantity Left</div><div class="value" th:text="${task.quantityLeft}">0</div></div>-->
<!--                    <div class="valbox"><div class="label">Skilled</div><div class="value" th:text="${task.skilled}">0</div></div>-->
<!--                    <div class="valbox"><div class="label">Unskilled</div><div class="value" th:text="${task.unskilled ?: '&#45;&#45;'}">&#45;&#45;</div></div>-->
<!--                    <div class="valbox"><div class="label">Total</div><div class="value" th:text="${(task.skilled ?: 0) + (task.unskilled ?: 0)}">0</div></div>-->
                </td>
            </tr>
        </table>
    </div>
</div>

<!--Site resource and material log-->

<div class="container mx-auto p-4 md:p-8">
    <main>
        <section id="active-requests">
            <h2 class="text-2xl font-semibold mb-4">Active Resource Requests</h2>
                <!--
                  The status decides three classes, and all three are derived from the constant
                  name rather than matched against a list of spellings. Every one of these used to
                  compare #strings.toLowerCase(indent.status) against 'on-site', which the enum
                  never equals: it lowercases to on_site, with an underscore. ON_SITE therefore got
                  no border, no pill and no dot, while the four constants with no underscore in
                  them happened to match, which is why the fault looked intermittent. Deriving the
                  suffix removes the whole class of it, and it covers CANCELLED, which none of the
                  branches named at all.
                -->
                <div th:each="indent : ${indents}" class="bg-white rounded-xl shadow-md overflow-hidden mb-6"
                     th:with="statusKey=${#strings.replace(#strings.toLowerCase(indent.status), '_', '-')}"
                     th:classappend="${'status-' + statusKey}">
                    <div class="indent-header">
                        <table style="width: 100%;">
                            <tr>
                                <td style="vertical-align: top;">
                                    <p class="text-sm text-gray-500">Indent Number</p>
                                    <h3 class="text-lg font-semibold text-gray-900" th:text="${indent.indentNumber}">INT-0000</h3>
                                </td>
                                <td class="status-cell">
                                    <span class="status-badge text-sm font-semibold px-3 py-1 rounded-full"
                                          th:classappend="${'badge-' + statusKey}">
                                        <span class="status-dot" th:classappend="${'dot-' + statusKey}"></span>
                                        <span th:text="${indent.status.label}">Status</span>
                                    </span>
                                </td>
                            </tr>
                        </table>
                            <table class="details-table mt-4 text-sm">
                                <tr>
                                    <td>
                                        <p class="font-medium text-gray-500">Created By</p>
                                        <p class="text-gray-800" th:text="${indent.createdBy?.employeeName ?: '-'}"></p>
                                    </td>
                                </tr>
                            </table>
                    </div>
                </div>

        </section>
    </main>
</div>

</body>
</html>
