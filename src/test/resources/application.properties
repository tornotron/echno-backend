# Test-only property values so slice tests (e.g. @WebMvcTest) can build a context
# without the runtime environment variables. The JWT decoder built from this URI is
# lazy and never contacted: web-slice authz tests authenticate via SecurityMockMvc
# (.with(jwt(...))), which sets the authentication directly and bypasses decoding.
SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI=http://localhost:0/protocol/openid-connect/certs
# A context starting up must not write to the database other tests are using. A test that needs the
# startup tasks calls StartupTaskRunner.runOnce itself.
echno.startup-tasks.enabled=false
# Provider calls are made by a schedule in production. A test that needs them calls IdentityTaskWorker.runDue.
echno.identity.tasks.enabled=false
# The invitation sync runs on a schedule in production. A test that needs it calls InvitationSyncJob.runOnce.
echno.invitations.sync.enabled=false
